<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Modern Tagihan Listrik</title>
    
    <!-- Menggunakan Tailwind CSS untuk styling modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Menggunakan font Inter dari Google Fonts untuk tampilan yang lebih bersih -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Menjadikan font Inter sebagai font default */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800">

    <div class="container mx-auto max-w-6xl p-4 sm:p-6 lg:p-8">

        <!-- Header Aplikasi -->
        <header class="text-center mb-10">
            <div class="flex justify-center items-center gap-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Logo_PLN.svg/1200px-Logo_PLN.svg.png" 
                     alt="Logo PLN" 
                     class="w-14 h-auto"
                     onerror="this.onerror=null;this.src='https://placehold.co/60x80/facc15/333?text=PLN';">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Kalkulator Tagihan Listrik</h1>
                    <p class="text-sm text-slate-500">Hitung estimasi tagihan listrik Anda dengan mudah.</p>
                </div>
            </div>
        </header>

        <!-- Konten Utama: Form dan Hasil -->
        <main class="grid grid-cols-1 lg:grid-cols-2 gap-10">

            <!-- Kolom Formulir Input -->
            <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg">
                <h2 class="text-xl font-bold mb-6">Masukkan Data Pelanggan</h2>
                <form id="formHitung">
                    <div class="space-y-5">
                        <!-- Input Nama Pelanggan -->
                        <div>
                            <label for="namaPelanggan" class="block text-sm font-medium text-slate-700 mb-1">Nama Pelanggan</label>
                            <input type="text" id="namaPelanggan" name="namaPelanggan" maxlength="50" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        </div>

                        <!-- Input Kategori Pelanggan -->
                        <div>
                            <label for="kategori" class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                            <select id="kategori" name="kategori" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition bg-white">
                                <option value="">Pilih Kategori...</option>
                                <option value="sosial">Sosial (2200 VA)</option>
                                <option value="rumahTangga">Rumah Tangga (1300 VA)</option>
                                <option value="industri">Industri (6600 VA)</option>
                            </select>
                        </div>

                        <!-- Input Periode -->
                        <div>
                            <label for="periodeAwal" class="block text-sm font-medium text-slate-700 mb-1">Periode Tagihan</label>
                            <div class="flex items-center space-x-2">
                                <input type="date" id="periodeAwal" name="periodeAwal" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                                <span class="text-slate-500">s/d</span>
                                <input type="date" id="periodeAkhir" name="periodeAkhir" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                            </div>
                        </div>

                        <!-- Input Jumlah Pemakaian -->
                        <div>
                            <label for="jumlahPemakaian" class="block text-sm font-medium text-slate-700 mb-1">Jumlah Pemakaian Listrik (kWh)</label>
                            <input type="number" id="jumlahPemakaian" name="jumlahPemakaian" min="1" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                        </div>
                    </div>

                    <!-- Tombol Aksi -->
                    <div class="flex flex-col sm:flex-row gap-3 mt-8">
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-300">
                            Hitung Tagihan
                        </button>
                        <button type="reset" id="resetButton" class="w-full bg-slate-200 text-slate-800 font-bold py-3 px-4 rounded-lg hover:bg-slate-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-400 transition duration-300">
                            Batal
                        </button>
                    </div>
                </form>
            </div>

            <!-- Kolom Rincian Tagihan (Awalnya Tersembunyi) -->
            <div id="rincianTagihan" class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg hidden">
                <h2 class="text-xl font-bold mb-4 pb-4 border-b border-slate-200">Rincian Tagihan</h2>
                <div class="space-y-3 text-sm">
                    <!-- Detail Tagihan akan ditampilkan di sini -->
                    <div class="flex justify-between items-center">
                        <span class="text-slate-600">Nama Pelanggan</span>
                        <span id="namaPelangganCell" class="font-semibold text-right"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-600">Kategori</span>
                        <span id="kategoriCell" class="font-semibold text-right"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-600">Periode</span>
                        <span id="periodeCell" class="font-semibold text-right"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-600">Jumlah Pemakaian</span>
                        <span id="jumlahPemakaianCell" class="font-semibold text-right"></span>
                    </div>
                    
                    <hr class="my-4 border-dashed">

                    <div class="flex justify-between items-center">
                        <span class="text-slate-600">Tarif per kWh</span>
                        <span id="tarifPerKwhCell" class="font-semibold text-right"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-600">Biaya Abodemen</span>
                        <span id="abodemenCell" class="font-semibold text-right"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-600">Pajak</span>
                        <span id="pajakCell" class="font-semibold text-right"></span>
                    </div>
                    
                    <!-- Total Tagihan -->
                    <div class="mt-6 pt-4 border-t-2 border-slate-300">
                        <div class="flex justify-between items-center">
                            <span class="text-base font-bold">Total Tagihan</span>
                            <span id="subTotalCell" class="text-xl lg:text-2xl font-extrabold text-blue-600"></span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
